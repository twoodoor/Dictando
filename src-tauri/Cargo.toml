[package]
name = "dictando"
version = "0.1.0"
description = "Dictando — fast, accurate, local-first dictation"
authors = ["Dictando"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"

# Transcription engine (Parakeet/Whisper/Moonshine). ONNX feature covers the
# Parakeet TDT v3 default; whisper-cpp added later for the Whisper family.
transcribe-rs = { version = "0.3", features = ["onnx"] }

# Audio capture, text injection, clipboard, and global shortcuts.
cpal = "0.15"
enigo = "0.3"
arboard = "3"
tauri-plugin-global-shortcut = "2"

# Model downloads: HTTP streaming, gzip/tar extraction, checksum verification.
reqwest = { version = "0.12", features = ["blocking", "json"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

# Local-first transcription history (bundled SQLite — no system dependency).
rusqlite = { version = "0.32", features = ["bundled"] }

# macOS-only: query/prompt the Accessibility permission (needed for the global
# shortcut + keystroke injection).
[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.1"
