[package]
name = "mumblr"
version = "0.3.0"
description = "Mumblr — fast, accurate, local-first dictation"
authors = ["Mumblr"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Transcription engine — see per-target sections below. ONNX (Parakeet) ships
# no Intel-macOS prebuilt, so Intel macOS uses whisper.cpp (compiles from source)
# instead; every other target keeps Parakeet/ONNX.

# Audio capture, text injection, clipboard, and global shortcuts.
cpal = "0.15"
# Playback for the synthesized start/finish water-drop cues (see sound.rs).
# rodio rides on cpal 0.15 — the same version used for capture — so no
# duplicate cpal ends up in the dependency tree.
rodio = { version = "0.20", default-features = false }
enigo = "0.3"
arboard = "3"
tauri-plugin-global-shortcut = "2"

# Model downloads: HTTP streaming, gzip/tar extraction, checksum verification.
reqwest = { version = "0.12", features = ["blocking", "json"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

# Local-first transcription history (bundled SQLite — no system dependency).
rusqlite = { version = "0.32", features = ["bundled"] }

# macOS-only: query/prompt the Accessibility permission (needed for the global
# shortcut + keystroke injection).
[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.1"

# Transcription engine, chosen per target:
# - Intel macOS (x86_64): whisper.cpp (compiles from source; ONNX has no x86_64
#   macOS prebuilt binary).
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
transcribe-rs = { version = "0.3", features = ["whisper-cpp"] }

# - Everything else (Windows, Apple-Silicon macOS, Linux): Parakeet via ONNX,
#   plus whisper.cpp so the OpenAI Whisper (GGML) catalog entries also load.
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
transcribe-rs = { version = "0.3", features = ["onnx", "whisper-cpp"] }
